apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parser-eval.fullname" . }}
  labels:
    {{- include "parser-eval.labels" . | nindent 4 }}
spec:
  # One replica: runs, checks and settings live as files on one ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "parser-eval.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parser-eval.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/sealed: {{ toJson .Values.secrets | sha256sum | trunc 16 | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parser-eval
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: vlm-proxy
              containerPort: 8081
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: WORK_DIR
              value: /tmp/parser-eval-work
            - name: VLM_PROXY_PUBLIC_URL
              value: {{ include "parser-eval.proxyUrl" . | quote }}
            - name: COOKIE_SECURE
              value: {{ if and .Values.route.enabled .Values.route.tls .Values.route.tls.termination }}"true"{{ else }}"false"{{ end }}
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "parser-eval.secretName" . }}
                  key: APP_SECRET_KEY
            - name: APP_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "parser-eval.secretName" . }}
                  key: APP_INITIAL_PASSWORD
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "parser-eval.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.workDirSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
