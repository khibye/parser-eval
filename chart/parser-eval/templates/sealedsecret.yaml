{{- if .Values.secrets.sealedSecret.enabled }}
{{- $data := .Values.secrets.sealedSecret.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "parser-eval.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.secrets.sealedSecret.scope "namespace-wide" }}
    sealedsecrets.bitnami.com/namespace-wide: "true"
    {{- else if eq .Values.secrets.sealedSecret.scope "cluster-wide" }}
    sealedsecrets.bitnami.com/cluster-wide: "true"
    {{- end }}
    helm.sh/resource-policy: keep
spec:
  encryptedData:
    APP_SECRET_KEY: {{ required "Seal APP_SECRET_KEY with scripts/seal-secrets.sh and set secrets.sealedSecret.encryptedData.APP_SECRET_KEY" $data.APP_SECRET_KEY | quote }}
    APP_INITIAL_PASSWORD: {{ required "Seal APP_INITIAL_PASSWORD with scripts/seal-secrets.sh and set secrets.sealedSecret.encryptedData.APP_INITIAL_PASSWORD" $data.APP_INITIAL_PASSWORD | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.name }}
      labels:
        {{- include "parser-eval.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
